# Media upload destinations.
#
# Two named sources: images go to src/assets/images; downloadable files (PDFs,
# spreadsheets, decks, ZIPs) go to public/documents.
#
# Photos live under `src/` so Astro's image service can resize them at build time
# (`<Image>` builds a srcset of WebP renditions); uploads keep the `/images/…` shape
# below, which src/lib/photos.ts resolves to the built asset. Documents are served
# verbatim from their `output` path, so an uploaded `grant-rules.pdf` is reachable at
# /documents/grant-rules.pdf and can be linked from any page or impact body:
#
#   [Grant rules](/documents/grant-rules.pdf)
#
# The bare name works too — `[Grant rules](grant-rules.pdf)` — as does
# `documents/grant-rules.pdf`; astro.config.mjs rewrites both to the canonical
# /documents/… URL when the file exists (see prefixContentPaths).
#
# `rename: safe` on documents slugifies uploads so URLs stay link-friendly;
# image uploads keep their original names, as they always have.
media:
  - name: images
    label: Images
    # Under src/, so Astro optimises them; the value written into content stays
    # `/images/<file>` and src/lib/photos.ts resolves it to the built asset.
    input: src/assets/images
    output: /images
    categories: [image]

  - name: documents
    label: Documents (PDF, CSV, ZIP…)
    input: public/documents
    output: /documents
    # document = pdf, doc(x), xls(x), csv, ppt(x), txt, rtf, odt, ods…
    categories: [document, spreadsheet]
    rename: safe

content:
  # Standalone pages (created manually as needed). Filename becomes the URL:
  # about.md -> /about
  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    fields:
      - name: title
        label: Page Title
        type: string
        required: true

      - name: description
        label: Meta Description
        type: string
        required: false

      - name: heroImage
        label: Hero Image (upload, or path such as /images/about/team.jpg)
        type: image
        required: false
        options:
          media: images

      - name: heroAlt
        label: Hero Image Alt Text
        type: string
        required: false

      # Layout options: auto (default) | page | home | gallery
      # "auto" means: gallery when the gallery folder has images, else page.
      - name: layout
        label: "Layout (auto, page, home or gallery)"
        type: string
        required: false

      # Folder inside src/assets/images holding this page's gallery images.
      # Leave blank to use a folder named after the page.
      - name: gallery
        label: Gallery Folder (optional)
        type: string
        required: false

      # CSS aspect-ratio for gallery tiles, e.g. 3/2, 1/1, 16/9
      - name: galleryAspect
        label: "Gallery Tile Aspect Ratio (default 3/2)"
        type: string
        required: false

      # Optional per-image captions. One line per image, format:
      # filename.jpg: Caption text shown in the lightbox and as alt text.
      # Lines are parsed in Astro; empty lines are ignored.
      - name: captions
        label: "Image Captions (filename: caption)"
        type: text
        required: false

      # Embeds a generated block in the page: `people` renders one card per file
      # in src/content/people. Put `<!-- cards -->` on a line of its own where the
      # cards should appear (text above and below them is kept); leave it out and
      # they follow the page text. Leave the field empty for a plain prose page.
      - name: cards
        label: "Cards (people, or empty)"
        type: string
        required: false

      # Page body. Link an uploaded document with
      # [Annual report](/documents/annual-report-2026.pdf).
      # Insert a raw HTML snippet (see the Snippets collection) by putting
      # `{{snippet-name}}` on a line of its own — it is replaced verbatim.
      - name: body
        label: Page Content
        type: rich-text
        options:
          media: images

  # Impact posts (blog-like), listed at /impact. Filename becomes the URL:
  # 2026-09-25-spring-country.md -> /impact/2026-09-25-spring-country
  - name: impact
    label: Impact
    type: collection
    path: src/content/impact
    fields:
      - name: title
        label: Article Title
        type: string
        required: true

      # Date format uses date-fns tokens: MM = month, mm = MINUTES. The old
      # `yyyy-mm-dd` wrote year-minutes-day (e.g. 2026-00-23) on every save.
      - name: pubDate
        label: Publish Date
        type: date
        options:
          format: yyyy-MM-dd
        required: true

      - name: description
        label: Summary
        type: string
        required: true

      # Shown at the top of the post.
      - name: image
        label: Featured Image
        type: image
        required: false
        options:
          media: images

      - name: imageAlt
        label: Featured Image Alt Text
        type: string
        required: false

      # Redirects the card on /impact: its image and title link here instead of to
      # the post's own /impact/<slug> page. Accepts a full URL (https://…) or a site
      # path (/documents/x.pdf); external URLs open in a new tab. The "Read more"
      # CTA always leads to the post, so a redirected card still reaches its story.
      - name: link
        label: Card Link (URL or /documents/… path)
        type: string
        required: false

      # Layout options: auto (default) | page | gallery
      - name: layout
        label: "Layout (auto, page or gallery)"
        type: string
        required: false

      # Folder inside src/assets/images holding this article's gallery images.
      # Leave blank to use a folder named after the article.
      - name: gallery
        label: Gallery Folder (optional)
        type: string
        required: false

      # CSS aspect-ratio for gallery tiles, e.g. 3/2, 1/1, 16/9
      - name: galleryAspect
        label: "Gallery Tile Aspect Ratio (default 3/2)"
        type: string
        required: false

      # Optional per-image captions. One line per image, format:
      # filename.jpg: Caption text shown in the lightbox and as alt text.
      # Lines are parsed in Astro; empty lines are ignored.
      - name: captions
        label: "Image Captions (filename: caption)"
        type: text
        required: false

      # Post body. Link an uploaded document with
      # [Annual report](/documents/annual-report-2026.pdf).
      # `{{snippet-name}}` inserts a raw HTML snippet verbatim (see Snippets).
      - name: body
        label: Content
        type: rich-text
        options:
          media: images

  # Partner organisations (listed on /partners)
  - name: partners
    label: Partners
    type: collection
    path: src/content/partners
    fields:
      - name: name
        label: Partner Name
        type: string
        required: true

      - name: description
        label: Description
        type: string
        required: false

      - name: logo
        label: Logo (upload, or path such as /images/partners/nic.png)
        type: image
        required: false
        options:
          media: images

      - name: link
        label: Website (optional)
        type: string
        required: false

      - name: order
        label: Sort Order (lower first, default 0)
        type: number
        required: false

  # People shown as cards on /people. Filename becomes the card's slug and the
  # name of its portrait folder: rachel-honnery.md -> src/assets/images/people/
  # rachel-honnery.jpg. The body is the bio — plain prose, no HTML needed.
  - name: people
    label: People
    type: collection
    path: src/content/people
    fields:
      - name: name
        label: Name
        type: string
        required: true

      - name: role
        label: Role (short line under the name)
        type: string
        required: false

      # Leave blank to use src/assets/images/people/<filename>.jpg (or .png/.webp).
      - name: image
        label: Portrait (upload, or path such as /images/people/jane-doe.png)
        type: image
        required: false
        options:
          media: images

      - name: imageAlt
        label: Portrait Alt Text
        type: string
        required: false

      - name: link
        label: Profile Link (optional)
        type: string
        required: false

      - name: linkLabel
        label: Profile Link Text (default "More")
        type: string
        required: false

      - name: order
        label: Sort Order (lower first, default 0)
        type: number
        required: false

      # Bio shown inside the card.
      - name: body
        label: Bio
        type: rich-text
        options:
          media: images

  # Raw HTML snippets, inserted verbatim into any page or impact post with
  # `{{snippet-name}}` on a line of its own (like `{{cards}}`, but the HTML is
  # exactly what you type here — no markdown, no rich-text rewriting). The
  # filename becomes the name: contact-form.md -> {{contact-form}}.
  # Use this for forms, embeds and scripts, which the rich-text body field
  # would strip. The plain text editor below keeps the markup byte-for-byte.
  - name: snippets
    label: HTML Snippets
    label_singular: HTML Snippet
    type: collection
    path: src/content/snippets
    fields:
      # Optional label, shown in the CMS list only. The filename is what pages use
      # (contact-form.md -> {{contact-form}), so this never appears on a page.
      - name: title
        label: Label (optional)
        type: string
        required: false

      - name: body
        label: HTML (inserted verbatim with {{name}})
        type: text
