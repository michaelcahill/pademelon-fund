# Media uploads destination
media:
  input: public/images
  output: /images

content:
  # Standalone pages (created manually as needed)
  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    fields:
      - name: title
        label: Page Title
        type: string
        required: true

      - name: description
        label: Meta Description
        type: string
        required: false

      - name: body
        label: Page Content
        type: rich-text

  # News posts (blog-like)
  - name: news
    label: News
    type: collection
    path: src/content/news
    format: md # or mdx
    fields:
      - name: title
        label: Article Title
        type: string
        required: true

      - name: pubDate
        label: Publish Date
        type: date
        options:
          format: YYYY-MM-DD
        required: true

      - name: description
        label: Summary
        type: string
        required: true

      - name: image
        label: Featured Image
        type: image
        required: false

      - name: body
        label: Content
        type: rich-text
