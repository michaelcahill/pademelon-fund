# Media uploads destination
media:
  input: public/images
  output: /images

content:
  # Standalone pages (created manually as needed)
  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    fields:
      - name: title
        label: Page Title
        type: string
        required: true

      - name: description
        label: Meta Description
        type: string
        required: false

      - name: heroImage
        label: Hero Image (upload, or path such as /images/about/team.jpg)
        type: image
        required: false

      - name: heroAlt
        label: Hero Image Alt Text
        type: string
        required: false

      # Layout options: auto (default) | page | home | gallery
      # "auto" means: gallery when the gallery folder has images, else page.
      - name: layout
        label: "Layout (auto, page, home or gallery)"
        type: string
        required: false

      # Folder inside public/images holding this page's gallery images.
      # Leave blank to use a folder named after the page.
      - name: gallery
        label: Gallery Folder (optional)
        type: string
        required: false

      # CSS aspect-ratio for gallery tiles, e.g. 3/2, 1/1, 16/9
      - name: galleryAspect
        label: "Gallery Tile Aspect Ratio (default 3/2)"
        type: string
        required: false

      - name: body
        label: Page Content
        type: rich-text

  # News posts (blog-like)
  - name: news
    label: News
    type: collection
    path: src/content/news
    fields:
      - name: title
        label: Article Title
        type: string
        required: true

      - name: pubDate
        label: Publish Date
        type: date
        options:
          format: yyyy-mm-dd
        required: true

      - name: description
        label: Summary
        type: string
        required: true

      - name: image
        label: Featured Image
        type: image
        required: false

      - name: imageAlt
        label: Featured Image Alt Text
        type: string
        required: false

      # Layout options: auto (default) | page | gallery
      - name: layout
        label: "Layout (auto, page or gallery)"
        type: string
        required: false

      # Folder inside public/images holding this article's gallery images.
      # Leave blank to use a folder named after the article.
      - name: gallery
        label: Gallery Folder (optional)
        type: string
        required: false

      # CSS aspect-ratio for gallery tiles, e.g. 3/2, 1/1, 16/9
      - name: galleryAspect
        label: "Gallery Tile Aspect Ratio (default 3/2)"
        type: string
        required: false

      - name: body
        label: Content
        type: rich-text
